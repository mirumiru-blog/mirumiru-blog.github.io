<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杏仁ミル 歌回歌單</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span class="topbar-name">♥ 杏仁ミル 歌回歌單</span>
    <span id="today-label" class="topbar-date"></span>
  </div>

  <div class="page">
    <h1 class="box title">杏 仁 ミ ル の 歌 回 歌 單 ＊</h1>

    <div class="head-row">
      <div class="box intro">
        歡迎來點歌～<br>
        找到想聽的歌，按「複製歌名」貼到聊天室就可以點歌囉 ♥
      </div>
      <div class="head-side">
        <nav id="languages" class="tabs" aria-label="語言"></nav>
        <p class="box visitors" aria-live="polite">
          Today's Visitors: <span id="visitors-today">--</span>
          &nbsp;Total Visitors: <span id="visitors-total">--</span>
        </p>
      </div>
    </div>

    <div class="body-row">
      <main class="box main">
        <p class="post-date"><span id="post-date" class="box"></span> ♪</p>

        <div class="search-row">
          <label for="search">Song Search</label>
          <input id="search" type="search" placeholder="歌名或歌手" autocomplete="off">
        </div>
        <div id="categories" class="chips" role="group" aria-label="語言與類別"></div>

        <p id="count" class="count" aria-live="polite"></p>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden>找不到符合的歌曲，換個關鍵字試試看</p>
      </main>

      <aside class="side">
        <section class="side-block side-owner">
          <img id="owner-avatar" class="owner-avatar" alt="" width="240" height="240">
          <p id="owner-caption" class="owner-caption"></p>
        </section>

        <section class="side-block side-calendar">
          <h2 class="side-title">Calendar</h2>
          <div class="cal-nav">
            <button id="cal-prev" type="button" aria-label="上個月">&lt;&lt;</button>
            <span id="cal-label"></span>
            <button id="cal-next" type="button" aria-label="下個月">&gt;&gt;</button>
          </div>
          <table class="calendar">
            <thead>
              <tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>
            </thead>
            <tbody id="cal-body"></tbody>
          </table>
        </section>

        <section class="side-block side-categories">
          <h2 class="side-title">Categories</h2>
          <ul id="tree" class="tree"></ul>
        </section>

        <section class="side-block side-player">
          <h2 class="side-title">Now Playing</h2>
          <div id="player" class="player"></div>
        </section>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
