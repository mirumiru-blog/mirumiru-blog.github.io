<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>網頁邏輯測試</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    .pass { color: #1a7f37; } .fail { color: #cf222e; }
  </style>
</head>
<body>
  <h1 id="summary">執行中…</h1>
  <ul id="results"></ul>
  <script type="module">
    import { ALL, availableCategories, categoryTree, filterSongs, listLanguages, normalizeText, sungInfo } from "../site/filter.js";
    import { isoDate, monthGrid, shiftMonth, todayInTaipei } from "../site/calendar.js";
    import { countVisit, namespaceFor } from "../site/counter.js";
    import { formatTime, parseYouTubeId, playlistFrom } from "../site/player.js";

    const song = (name, language, category) => ({ name, language, category, count: 0, lastSung: null });
    const songs = [
      song("ドライフラワー", "日文", "JPOP"),
      song("残酷な天使のテーゼ", "日文", "動漫歌曲"),
      song("Just be friends", "日文", "V家"),
      song("楊丞琳- 理想情人", "中文", "中文"),
      song("黃妃- 追追追", "台語", "台語"),
    ];
    const names = (list) => list.map((s) => s.name);

    // 假的計數服務：記錄呼叫的網址，回傳指定的值
    function fakeCounter(values = {}, { status = 200 } = {}) {
      const calls = [];
      const fetchFn = async (url) => {
        calls.push(url);
        const key = url.split("/").pop();
        if (status !== 200) return { ok: false, status, json: async () => ({}) };
        if (!(key in values)) return { ok: false, status: 404, json: async () => ({ error: "Key not found" }) };
        return { ok: true, status: 200, json: async () => ({ value: values[key] }) };
      };
      return { calls, fetchFn };
    }
    function memoryStorage(initial = {}) {
      const data = { ...initial };
      return { getItem: (k) => data[k] ?? null, setItem: (k, v) => (data[k] = v), data };
    }

    const tests = {
      // ---------- 搜尋與篩選 ----------
      "空條件回傳全部"() {
        eq(filterSongs(songs).length, 5);
      },
      "關鍵字比對歌名"() {
        eq(names(filterSongs(songs, { query: "天使" })), ["残酷な天使のテーゼ"]);
      },
      "關鍵字比對歌手（歌名欄內）"() {
        eq(names(filterSongs(songs, { query: "楊丞琳" })), ["楊丞琳- 理想情人"]);
      },
      "搜尋忽略大小寫與空白"() {
        eq(names(filterSongs(songs, { query: "JUSTBE" })), ["Just be friends"]);
      },
      "全形英文可搜到半形"() {
        eq(names(filterSongs(songs, { query: "ｊｕｓｔ" })), ["Just be friends"]);
      },
      "平假名可搜到片假名"() {
        eq(names(filterSongs(songs, { query: "どらいふらわー" })), ["ドライフラワー"]);
      },
      "依語言篩選"() {
        eq(names(filterSongs(songs, { language: "台語" })), ["黃妃- 追追追"]);
      },
      "語言加類別一起篩選"() {
        eq(names(filterSongs(songs, { language: "日文", category: "V家" })), ["Just be friends"]);
      },
      "語言、類別與關鍵字同時套用"() {
        eq(filterSongs(songs, { language: "日文", category: "JPOP", query: "天使" }).length, 0);
      },
      "找不到時回傳空陣列"() {
        eq(filterSongs(songs, { query: "不存在的歌" }), []);
      },
      "語言清單依資料順序且不重複"() {
        eq(listLanguages(songs), ["日文", "中文", "台語"]);
      },
      "類別只列出所選語言內的"() {
        eq(availableCategories(songs, "日文"), ["JPOP", "動漫歌曲", "V家"]);
      },
      "和語言同名的類別不顯示"() {
        eq(availableCategories(songs, "中文"), []);
        eq(availableCategories(songs, ALL), ["JPOP", "動漫歌曲", "V家"]);
      },
      "normalizeText 處理空值"() {
        eq(normalizeText(undefined), "");
      },
      "有紀錄時顯示次數與上次日期"() {
        eq(sungInfo({ count: 3, lastSung: "2026-10-12" }), "唱過 3 次 · 上次 2026/10/12");
      },
      "沒紀錄時顯示還沒唱過"() {
        eq(sungInfo({ count: 0, lastSung: null }), "還沒唱過");
        eq(sungInfo({}), "還沒唱過");
      },
      "側欄分類樹含各語言與類別數量"() {
        eq(categoryTree(songs), [
          { language: "日文", count: 3, categories: [
            { name: "JPOP", count: 1 }, { name: "動漫歌曲", count: 1 }, { name: "V家", count: 1 },
          ] },
          { language: "中文", count: 1, categories: [] },
          { language: "台語", count: 1, categories: [] },
        ]);
      },

      // ---------- 日曆 ----------
      "2026 年 10 月從週四開始、共 31 天"() {
        const weeks = monthGrid(2026, 10);
        eq(weeks[0], [null, null, null, null, 1, 2, 3]);
        eq(weeks.flat().filter(Boolean).length, 31);
        eq(weeks.every((w) => w.length === 7), true);
      },
      "閏年二月有 29 天"() {
        eq(monthGrid(2028, 2).flat().filter(Boolean).length, 29);
        eq(monthGrid(2026, 2).flat().filter(Boolean).length, 28);
      },
      "切換月份可跨年"() {
        eq(shiftMonth({ year: 2026, month: 12 }, 1), { year: 2027, month: 1 });
        eq(shiftMonth({ year: 2026, month: 1 }, -1), { year: 2025, month: 12 });
      },
      "今天以台灣時間計算"() {
        // UTC 10/15 20:00 = 台灣 10/16 04:00
        eq(todayInTaipei(new Date("2026-10-15T20:00:00Z")), { year: 2026, month: 10, day: 16 });
        eq(isoDate({ year: 2026, month: 1, day: 5 }), "2026-01-05");
      },

      // ---------- 訪客計數 ----------
      "正式網站與本機使用不同計數器"() {
        eq(namespaceFor("enderman1000456-tech.github.io"), "almond-milk-songlist");
        eq(namespaceFor("localhost"), "almond-milk-songlist-dev");
      },
      async "今天第一次來訪會加一並記住"() {
        const { calls, fetchFn } = fakeCounter({ "day-2026-10-16": 5, total: 120 });
        const storage = memoryStorage();
        const result = await countVisit({ today: "2026-10-16", namespace: "ns", fetchFn, storage });
        eq(result, { today: 5, total: 120 });
        eq(calls.every((u) => u.includes("/hit/ns/")), true);
        eq(storage.data.lastCountedVisit, "2026-10-16");
      },
      async "同一天再來只讀取不加一"() {
        const { calls, fetchFn } = fakeCounter({ "day-2026-10-16": 5, total: 120 });
        const storage = memoryStorage({ lastCountedVisit: "2026-10-16" });
        await countVisit({ today: "2026-10-16", namespace: "ns", fetchFn, storage });
        eq(calls.every((u) => u.includes("/get/ns/")), true);
      },
      async "隔天再來會重新加一"() {
        const { calls, fetchFn } = fakeCounter({ "day-2026-10-17": 1, total: 121 });
        const storage = memoryStorage({ lastCountedVisit: "2026-10-16" });
        await countVisit({ today: "2026-10-17", namespace: "ns", fetchFn, storage });
        eq(calls.every((u) => u.includes("/hit/")), true);
      },
      async "計數器還沒建立時視為 0"() {
        const { fetchFn } = fakeCounter({ total: 7 });
        const storage = memoryStorage({ lastCountedVisit: "2026-10-16" });
        eq(await countVisit({ today: "2026-10-16", namespace: "ns", fetchFn, storage }), { today: 0, total: 7 });
      },
      async "服務故障時回傳 null 且不記住"() {
        const { fetchFn } = fakeCounter({}, { status: 500 });
        const storage = memoryStorage();
        eq(await countVisit({ today: "2026-10-16", namespace: "ns", fetchFn, storage }), null);
        eq(storage.data.lastCountedVisit, undefined);
      },
      async "無法使用 localStorage 時仍可計數"() {
        const { fetchFn } = fakeCounter({ "day-2026-10-16": 1, total: 1 });
        const broken = { getItem() { throw new Error("blocked"); }, setItem() { throw new Error("blocked"); } };
        eq(await countVisit({ today: "2026-10-16", namespace: "ns", fetchFn, storage: broken }), { today: 1, total: 1 });
      },

      // ---------- 播放器 ----------
      "各種 YouTube 網址都能取出影片 ID"() {
        const id = "9rr2Oww94a8";
        for (const url of [
          "https://youtu.be/9rr2Oww94a8?si=eheN7IL6yK9_a3-s",
          "https://www.youtube.com/watch?v=9rr2Oww94a8&t=30s",
          "https://m.youtube.com/watch?v=9rr2Oww94a8",
          "https://music.youtube.com/watch?v=9rr2Oww94a8",
          "https://www.youtube.com/embed/9rr2Oww94a8",
          "https://www.youtube.com/shorts/9rr2Oww94a8",
          "https://www.youtube.com/live/9rr2Oww94a8?si=x",
          " 9rr2Oww94a8 ",
        ]) eq([url, parseYouTubeId(url)], [url, id]);
      },
      "不是 YouTube 的網址回傳 null"() {
        for (const url of ["", null, "https://example.com/watch?v=9rr2Oww94a8", "https://youtu.be/", "不是網址", "https://www.youtube.com/watch?v=short"]) {
          eq([url, parseYouTubeId(url)], [url, null]);
        }
      },
      "播放清單略過錯誤網址、補上預設歌名"() {
        eq(playlistFrom([
          { title: " 平靜 ", url: "https://youtu.be/9rr2Oww94a8" },
          { title: "壞掉的", url: "https://example.com" },
          { url: "https://youtu.be/oH8g3NER6_k" },
        ]), [
          { title: "平靜", id: "9rr2Oww94a8" },
          { title: "未命名歌曲", id: "oH8g3NER6_k" },
        ]);
        eq(playlistFrom(undefined), []);
      },
      "時間格式為 分:秒"() {
        eq(formatTime(12), "00:12");
        eq(formatTime(143.9), "02:23");
        eq(formatTime(3723), "62:03");
        eq(formatTime(NaN), "00:00");
        eq(formatTime(-5), "00:00");
      },

      // ---------- 網站設定檔 ----------
      async "settings.json 格式正確且大頭貼存在"() {
        const settings = await (await fetch("../site/data/settings.json")).json();
        eq(typeof settings.owner.name, "string");
        const avatar = await fetch(`../site/${settings.owner.avatar}`, { method: "HEAD" });
        eq(avatar.ok, true);
        eq(playlistFrom(settings.player).length, settings.player.length);
      },
    };

    function eq(actual, expected) {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) throw new Error(`預期 ${e}，實際 ${a}`);
    }

    let failed = 0;
    for (const [name, fn] of Object.entries(tests)) {
      const li = document.createElement("li");
      try { await fn(); li.className = "pass"; li.textContent = `✓ ${name}`; }
      catch (err) { failed++; li.className = "fail"; li.textContent = `✗ ${name}：${err.message}`; }
      document.getElementById("results").append(li);
    }
    const total = Object.keys(tests).length;
    const summary = failed ? `FAIL：${failed} / ${total} 失敗` : `PASS：${total} 項全部通過`;
    document.getElementById("summary").textContent = summary;
    document.getElementById("summary").className = failed ? "fail" : "pass";
    document.title = summary;
  </script>
</body>
</html>
